name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A failing palette fails the build (#67).
      - run: pnpm validate:palette

      # Biome lint — replaces the never-configured `next lint` (#9 groundwork).
      - run: pnpm lint

      - run: pnpm build

      # Fail if a server-only secret reached the client bundle (#9).
      - run: pnpm check:bundle

      - run: pnpm test

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      # pgTAP RLS suite (#7) — runs against a fresh reset, not a persisted
      # database, so it can't pass by accumulating state across runs.
      - run: supabase db reset
      - run: supabase test db