name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A failing palette fails the build (#67).
      - run: pnpm validate:palette

      # Biome lint — replaces the never-configured `next lint` (#9 groundwork).
      # Covers apps/mobile too now that it has its own `lint` script (turbo
      # runs a package's script only if the package defines it).
      - run: pnpm lint

      # apps/mobile has no equivalent to `next build`'s implicit type
      # checking — `expo export` below only transpiles, it doesn't run tsc.
      # Explicit here since there's no generic `typecheck` turbo task any
      # package in this repo uses yet.
      - run: pnpm --filter @ecopower/mobile typecheck

      # turbo run build now also covers apps/mobile (its own `build` script
      # is `expo export --platform android` — a real Metro bundle, the
      # closest thing to a smoke test without a device/simulator in CI).
      - run: pnpm build

      # Fail if a server-only secret reached the client bundle (#9).
      - run: pnpm check:bundle

      - run: pnpm test

  rls-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase start

      # pgTAP RLS suite (#7) — runs against a fresh reset, not a persisted
      # database, so it can't pass by accumulating state across runs.
      - run: supabase db reset
      - run: supabase test db